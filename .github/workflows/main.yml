name: Maspero Stream Finder

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture Maspero Stream
        run: node capture.js
